name: Apply experiment source patch

on:
  push:
    branches:
      - 'experiment/**'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- app/src/main/java/com/example/screentranslator/FloatingService.kt; then
            echo 'No source changes needed.'
          else
            git add app/src/main/java/com/example/screentranslator/FloatingService.kt
            git commit -m 'Fix dynamic floating menu and rotation capture'
            git push
          fi
          rm .github/workflows/patch-experiment.yml
          git add .github/workflows/patch-experiment.yml
          git commit -m 'Remove one-time patch workflow'
          git push
