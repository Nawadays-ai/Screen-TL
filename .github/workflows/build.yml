name: Build Android APK

# Build otomatis setiap push ke main atau branch eksperimen visual.
# workflow_dispatch tetap tersedia.

on:
  push:
    branches:
      - main
      - 'experiment/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply floating menu anchor fix
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        path = Path('app/src/main/java/com/example/screentranslator/FloatingService.kt')
        text = path.read_text()
        geometry = re.compile(r'''        val rootWidth = menuWidth \+ gap \+ fabSize\n        val rootHeight = .*?\n        val rawX = .*?\n        val rawY = .*?\n        val rootX = .*?\n        val rootY = .*?''')
        replacement = '''        val rootWidth = menuWidth + gap + fabSize
        // The root contains the complete menu + FAB stack so the FAB keeps
        // its exact dragged screen coordinate when the menu opens.
        val rootHeight = menuHeight + gap + fabSize
        val rawX = if (placeRight) fabScreenX else fabScreenX - menuWidth - gap
        val rawY = if (placeAbove) fabScreenY - menuHeight - gap else fabScreenY
        val rootX = rawX.coerceIn(0, (screenWidth - rootWidth).coerceAtLeast(0))
        val rootY = rawY.coerceIn(0, (screenHeight - rootHeight).coerceAtLeast(0))'''
        text, count = geometry.subn(replacement, text, count=1)
        if count != 1:
            raise SystemExit(f'Geometry block replacement count={count}')

        gravity = re.compile(r'''        if \(placeRight\) \{\n            menuParams\.gravity = .*?\n            fabParams\.gravity = .*?\n        \} else \{\n            menuParams\.gravity = .*?\n            fabParams\.gravity = .*?\n        \}''')
        gravity_replacement = '''        if (placeRight) {
            menuParams.gravity = Gravity.END or Gravity.TOP
            fabParams.gravity = if (placeAbove) Gravity.START or Gravity.BOTTOM else Gravity.START or Gravity.TOP
        } else {
            menuParams.gravity = Gravity.START or Gravity.TOP
            fabParams.gravity = if (placeAbove) Gravity.END or Gravity.BOTTOM else Gravity.END or Gravity.TOP
        }'''
        text, count = gravity.subn(gravity_replacement, text, count=1)
        if count != 1:
            raise SystemExit(f'Gravity block replacement count={count}')
        path.write_text(text)
        PY
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if ! git diff --quiet -- app/src/main/java/com/example/screentranslator/FloatingService.kt; then
          git add app/src/main/java/com/example/screentranslator/FloatingService.kt
          git commit -m 'Fix floating menu anchor on first tap'
          git push
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
