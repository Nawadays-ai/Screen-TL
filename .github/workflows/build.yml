name: Build Android APK

# Build hanya dijalankan saat diminta secara manual.
# Branch ini mengirim paket ZIP langsung ke Telegram dan tidak membuat Release.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.2'

    - name: Prepare persistent signing keystore
      env:
        SCREEN_TL_KEYSTORE_B64: ${{ secrets.SCREEN_TL_KEYSTORE }}
      run: |
        set -euo pipefail
        test -n "$SCREEN_TL_KEYSTORE_B64" || {
          echo "Missing GitHub Actions secret: SCREEN_TL_KEYSTORE"
          exit 1
        }
        echo "$SCREEN_TL_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/screentl-signing.jks"
        test -s "$RUNNER_TEMP/screentl-signing.jks"

    - name: Build Debug APK with persistent signing
      env:
        SCREEN_TL_KEYSTORE_FILE: ${{ runner.temp }}/screentl-signing.jks
        SCREEN_TL_KEYSTORE_PASSWORD: ${{ secrets.SCREEN_TL_KEYSTORE_PASSWORD }}
        SCREEN_TL_KEY_ALIAS: ${{ secrets.SCREEN_TL_KEY_ALIAS }}
        SCREEN_TL_KEY_PASSWORD: ${{ secrets.SCREEN_TL_KEY_PASSWORD }}
      run: gradle assembleDebug --stacktrace

    - name: Package APK as compressed ZIP
      run: |
        set -euo pipefail
        APK="app/build/outputs/apk/debug/app-debug.apk"
        ZIP="Screen-TL-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.zip"
        test -s "$APK"
        zip -9 "$ZIP" "$APK"
        sha256sum "$APK" "$ZIP"
        ls -lh "$APK" "$ZIP"
        echo "PACKAGE_NAME=$ZIP" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Telegram uploader
      run: python -m pip install -r tools/telegram_uploader/requirements.txt

    - name: Send compressed package to Telegram
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python tools/telegram_uploader/upload_apk.py \
          "$PACKAGE_NAME" \
          --branch "$GITHUB_REF_NAME" \
          --commit "$GITHUB_SHA" \
          --run "$GITHUB_RUN_NUMBER"

    # GitHub Actions artifact upload sengaja tidak digunakan.
    # Tidak ada GitHub Release otomatis pada branch pengujian ini.
