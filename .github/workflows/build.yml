name: Build Android APK

on:
  push:
    branches:
      - main
      - 'experiment/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply experiment fixes
      shell: bash
      run: |
        python3 <<'PY'
        from pathlib import Path

        path = Path('app/src/main/java/com/example/screentranslator/FloatingService.kt')
        text = path.read_text()

        old_menu = '''    private fun positionSubMenu() {
        layoutSubMenu.measure(
            View.MeasureSpec.makeMeasureSpec(dp(MENU_WIDTH_DP), View.MeasureSpec.EXACTLY),
            View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED)
        )
        val menuWidth = layoutSubMenu.measuredWidth.coerceAtLeast(dp(MENU_WIDTH_DP))
        val menuHeight = layoutSubMenu.measuredHeight
        val fabSize = dp(FAB_SIZE_DP)
        val gap = dp(MENU_GAP_DP)
        val screenWidth = resources.displayMetrics.widthPixels
        val screenHeight = resources.displayMetrics.heightPixels
        val placeRight = fabScreenX < screenWidth / 2
        val placeAbove = fabScreenY > screenHeight / 2
        val rootWidth = menuWidth + gap + fabSize
        val rootHeight = if (placeAbove) menuHeight + gap + fabSize else maxOf(menuHeight, fabSize)
        val rawX = if (placeRight) fabScreenX else fabScreenX - menuWidth - gap
        val rawY = if (placeAbove) fabScreenY - menuHeight - gap else fabScreenY - ((rootHeight - fabSize) / 2)
        val rootX = rawX.coerceIn(0, (screenWidth - rootWidth).coerceAtLeast(0))
        val rootY = rawY.coerceIn(0, (screenHeight - rootHeight).coerceAtLeast(0))
        val menuParams = layoutSubMenu.layoutParams as FrameLayout.LayoutParams
        val fabParams = fabMain.layoutParams as FrameLayout.LayoutParams
        menuParams.width = menuWidth
        menuParams.height = menuHeight
        menuParams.leftMargin = 0
        menuParams.topMargin = 0
        fabParams.width = fabSize
        fabParams.height = fabSize
        fabParams.leftMargin = 0
        fabParams.topMargin = 0
        if (placeRight) {
            menuParams.gravity = if (placeAbove) Gravity.END or Gravity.TOP else Gravity.END or Gravity.CENTER_VERTICAL
            fabParams.gravity = if (placeAbove) Gravity.START or Gravity.BOTTOM else Gravity.START or Gravity.CENTER_VERTICAL
        } else {
            menuParams.gravity = if (placeAbove) Gravity.START or Gravity.TOP else Gravity.START or Gravity.CENTER_VERTICAL
            fabParams.gravity = if (placeAbove) Gravity.END or Gravity.BOTTOM else Gravity.END or Gravity.CENTER_VERTICAL
        }
        layoutSubMenu.layoutParams = menuParams
        fabMain.layoutParams = fabParams
        params?.let {
            it.width = rootWidth
            it.height = rootHeight
            it.x = rootX
            it.y = rootY
            windowManager.updateViewLayout(floatingView, it)
        }
        Log.i(TAG, "Floating menu positioned: right=$placeRight above=$placeAbove root=$rootX,$rootY ${rootWidth}x$rootHeight")
    }
'''

        new_menu = '''    private fun positionSubMenu() {
        layoutSubMenu.measure(
            View.MeasureSpec.makeMeasureSpec(dp(MENU_WIDTH_DP), View.MeasureSpec.EXACTLY),
            View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED)
        )
        val menuWidth = layoutSubMenu.measuredWidth.coerceAtLeast(dp(MENU_WIDTH_DP))
        val menuHeight = layoutSubMenu.measuredHeight
        val fabSize = dp(FAB_SIZE_DP)
        val gap = dp(MENU_GAP_DP)
        val screenWidth = resources.displayMetrics.widthPixels
        val screenHeight = resources.displayMetrics.heightPixels

        // Choose the side with enough room instead of using the screen center.
        val roomRight = screenWidth - (fabScreenX + fabSize)
        val roomLeft = fabScreenX
        val placeRight = if (roomRight >= menuWidth + gap) true else roomLeft < menuWidth + gap

        // Choose vertical direction from available room. The FAB stays at the
        // exact dragged screen coordinate instead of being vertically centered.
        val roomBelow = screenHeight - (fabScreenY + fabSize)
        val roomAbove = fabScreenY
        val placeBelow = if (roomBelow >= menuHeight + gap) true else roomAbove < menuHeight + gap

        val rootWidth = menuWidth + gap + fabSize
        val rootHeight = menuHeight + gap + fabSize
        val rawX = if (placeRight) fabScreenX else fabScreenX - menuWidth - gap
        val rawY = if (placeBelow) fabScreenY else fabScreenY - menuHeight - gap
        val rootX = rawX.coerceIn(0, (screenWidth - rootWidth).coerceAtLeast(0))
        val rootY = rawY.coerceIn(0, (screenHeight - rootHeight).coerceAtLeast(0))

        val menuParams = layoutSubMenu.layoutParams as FrameLayout.LayoutParams
        val fabParams = fabMain.layoutParams as FrameLayout.LayoutParams
        menuParams.width = menuWidth
        menuParams.height = menuHeight
        menuParams.leftMargin = 0
        menuParams.topMargin = 0
        fabParams.width = fabSize
        fabParams.height = fabSize
        fabParams.leftMargin = 0
        fabParams.topMargin = 0

        if (placeRight) {
            menuParams.gravity = if (placeBelow) Gravity.END or Gravity.TOP else Gravity.END or Gravity.BOTTOM
            fabParams.gravity = if (placeBelow) Gravity.START or Gravity.TOP else Gravity.START or Gravity.BOTTOM
        } else {
            menuParams.gravity = if (placeBelow) Gravity.START or Gravity.TOP else Gravity.START or Gravity.BOTTOM
            fabParams.gravity = if (placeBelow) Gravity.END or Gravity.TOP else Gravity.END or Gravity.BOTTOM
        }
        layoutSubMenu.layoutParams = menuParams
        fabMain.layoutParams = fabParams
        params?.let {
            it.width = rootWidth
            it.height = rootHeight
            it.x = rootX
            it.y = rootY
            windowManager.updateViewLayout(floatingView, it)
        }
        Log.i(TAG, "Floating menu positioned: right=$placeRight below=$placeBelow root=$rootX,$rootY ${rootWidth}x$rootHeight fab=$fabScreenX,$fabScreenY")
    }
'''

        if old_menu in text:
            text = text.replace(old_menu, new_menu, 1)

        old_capture = '        val requested = manager.captureOnce { bitmap ->\n'
        new_capture = '        manager.ensureCurrentDisplayConfiguration()\n        val requested = manager.captureOnce { bitmap ->\n'
        if old_capture in text:
            text = text.replace(old_capture, new_capture)

        path.write_text(text)
        PY

    - name: Persist source fixes
      shell: bash
      run: |
        if git diff --quiet -- app/src/main/java/com/example/screentranslator/FloatingService.kt; then
          echo "No source fix to commit."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/screentranslator/FloatingService.kt
          git commit -m "Fix dynamic floating menu and rotation capture"
          git push
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
