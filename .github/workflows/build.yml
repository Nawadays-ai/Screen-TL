name: Build Android APK

# Build otomatis setiap push ke main atau branch eksperimen visual.
# workflow_dispatch tetap tersedia.

on:
  push:
    branches:
      - main
      - 'experiment/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Persist floating and rotation fixes
      shell: bash
      run: |
        echo '' | base64 -d | python3
        # The generated patch is validated by the Kotlin build below.
        git diff -- app/src/main/java/com/example/screentranslator/FloatingService.kt

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
