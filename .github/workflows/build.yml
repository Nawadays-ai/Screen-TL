name: Build Android APK

# Build dilakukan manual agar perubahan bertahap tidak membuat antrean build.
# Jalankan dari GitHub Actions -> Build Android APK -> Run workflow.
# Push ke main tidak lagi otomatis memulai build.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
