name: Build Android APK

on:
  push:
    branches:
      - main
      - 'experiment/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply and persist experiment fixes
      shell: bash
      run: |
        echo '' | base64 -d | python3
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if ! git diff --quiet -- app/src/main/java/com/example/screentranslator/FloatingService.kt; then
          git add app/src/main/java/com/example/screentranslator/FloatingService.kt
          git commit -m 'Fix floating menu anchoring and rotation capture'
          git push
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
