name: Build Android APK

# Build hanya dijalankan saat diminta secara manual.
# Branch ini menggunakan GitHub Release agar tidak memakai kuota Actions Artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.2'

    - name: Prepare persistent signing keystore
      env:
        SCREEN_TL_KEYSTORE_B64: ${{ secrets.SCREEN_TL_KEYSTORE }}
      run: |
        set -euo pipefail
        test -n "$SCREEN_TL_KEYSTORE_B64" || {
          echo "Missing GitHub Actions secret: SCREEN_TL_KEYSTORE"
          exit 1
        }
        echo "$SCREEN_TL_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/screentl-signing.jks"
        test -s "$RUNNER_TEMP/screentl-signing.jks"

    - name: Build Debug APK with persistent signing
      env:
        SCREEN_TL_KEYSTORE_FILE: ${{ runner.temp }}/screentl-signing.jks
        SCREEN_TL_KEYSTORE_PASSWORD: ${{ secrets.SCREEN_TL_KEYSTORE_PASSWORD }}
        SCREEN_TL_KEY_ALIAS: ${{ secrets.SCREEN_TL_KEY_ALIAS }}
        SCREEN_TL_KEY_PASSWORD: ${{ secrets.SCREEN_TL_KEY_PASSWORD }}
      run: gradle assembleDebug --stacktrace

    - name: Package APK as compressed ZIP
      run: |
        set -euo pipefail
        APK="app/build/outputs/apk/debug/app-debug.apk"
        ZIP="Screen-TL-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.zip"
        test -s "$APK"
        zip -9 "$ZIP" "$APK"
        sha256sum "$APK" "$ZIP"
        ls -lh "$APK" "$ZIP"
        echo "PACKAGE_NAME=$ZIP" >> "$GITHUB_ENV"

    - name: Publish ZIP to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="screen-tl-build-${GITHUB_RUN_ID}"
        NOTES="Automated Screen-TL build.

        Branch: ${GITHUB_REF_NAME}
        Commit: ${GITHUB_SHA}
        Package: ${PACKAGE_NAME}
        The ZIP contains the signed debug APK."

        gh release create "$TAG" "$PACKAGE_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "Screen-TL build #${GITHUB_RUN_NUMBER}" \
          --notes "$NOTES"

        echo "Release published: $TAG"
